name: Deploy web app (GitHub Pages)

# Publishes the web app to GitHub Pages.
#
# The app has no build step — it is static files served over HTTP. What we
# publish is `www/`, assembled by `npm run build:www` (the same script the
# mobile build uses), so the deployed site contains only runtime assets: no
# node_modules, no test suites, no dev config. All asset paths in the app are
# relative, so it works fine from the project-site subpath
# (https://<user>.github.io/<repo>/).
#
# Runs on every push to master, or manually from the Actions tab.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push supersede a queued one, but
# don't cancel a deploy that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build www/
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate the deploy on the unit suite. The Playwright golden master is
      # deliberately not run here — it needs a browser download and belongs in
      # the PR gate, not on the path to publishing.
      - name: Run tests
        run: npm test

      - name: Assemble web bundle
        run: npm run build:www

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: www

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
